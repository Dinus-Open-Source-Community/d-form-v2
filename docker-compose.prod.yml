name: d-form

# nk ngerubah docker-compose.prod.yml ati ati ya kang
# soal e iki nggo pipeline ng CI/CD
# nk meh ngerubah kondo fa'iz sek ya
services:
  db:
    image: mariadb:10.11
    container_name: prod_d-form-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password

    secrets:
      - db_root_password

    volumes:
      - prod_mysql_data_d_form:/var/lib/mysql
    networks:
      - d-form-internal

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.0-alpine
    container_name: prod_d-form-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--stop-writes-on-bgsave-error",
        "no"
      ]
    volumes:
      - prod_redis_data_d_form:/data
    networks:
      - d-form-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
    image: d-form-app:prod

    container_name: prod_d-form-app-core
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      # SSR menghasilkan <title>/meta/JSON-LD di HTML mentah; bila proses ssr mati,
      # HttpGateway gagal konek dan Inertia jatuh ke render client-side (tanpa error).
      INERTIA_SSR_ENABLED: "true"
      INERTIA_SSR_URL: http://ssr:13714
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ssr:
        condition: service_started
    networks:
      doscom_ingress:
        aliases:
          - d-form-app
      d-form-internal: {}
    volumes:
      - prod_app_storage_d_form:/app/storage/app
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Server-side rendering Inertia (Node). Tanpa port publik: hanya di d-form-internal.
  ssr:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
    image: d-form-app:prod
    container_name: prod_d-form-ssr
    restart: unless-stopped
    # Image prod ber-entrypoint PHP + CMD worker, jadi proses node harus mengganti entrypoint.
    entrypoint: ["node", "bootstrap/ssr/ssr.js"]
    working_dir: /app
    command: []
    expose:
      - "13714"
    networks:
      - d-form-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:13714/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  doscom_ingress:
    external: true
    name: doscom_ingress

  d-form-internal:
    driver: bridge
    internal: true

volumes:
  prod_mysql_data_d_form:
    driver: local
  prod_redis_data_d_form:
    driver: local
  prod_app_storage_d_form:
    driver: local

secrets:
  db_root_password:
    environment: DB_ROOT_PASSWORD
