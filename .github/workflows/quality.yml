name: Quality

# Gate CI: lint/format, test PHP, test+build frontend, dependency audit.
# E2E sengaja tidak dijalankan di sini; suite Playwright tetap tersedia lokal
# lewat `npm run test:e2e*` dan tidak menjadi syarat merge di GitHub Actions.
# PHP 8.4 = platform produksi (FrankenPHP 1-php8.4-alpine) dan pin
# `config.platform.php` di composer.json.

on:
    push:
        branches:
            - development
            - dev
            - dev-zapp
            - temp
    pull_request:
        branches:
            - development
            - dev
            - dev-zapp
            - temp

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PHP_VERSION: '8.4'
    NODE_VERSION: '24'
    # Ekstensi yang dibutuhkan composer.lock dan suite PHPUnit.
    PHP_EXTENSIONS: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip

jobs:
    lint:
        name: Lint & format
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none

            - name: Cache Composer Packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.composer/cache
                      ~/.cache/composer
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install Composer Dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Run Laravel Pint
              run: ./vendor/bin/pint --test

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install NPM Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            # .prettierignore mengecualikan components/ui (vendored shadcn-vue)
            # dan direktori generated Wayfinder.
            - name: Run Prettier
              run: npx prettier --check "resources/js/**/*.{ts,vue,js}" eslint.config.js "scripts/**/*.{js,mjs,ts}"

    php-tests:
        name: PHP tests
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none

            - name: Cache Composer Packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.composer/cache
                      ~/.cache/composer
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install Composer Dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            # phpunit.xml memasang `<server>` (sqlite :memory:, cache array,
            # queue sync, mail array), jadi tidak perlu service MySQL/Redis.
            - name: Prepare Environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run Unit and Feature Tests
              run: php artisan test

    frontend:
        name: Frontend test & build
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            # Wayfinder dan plugin build membutuhkan output `php artisan` yang
            # gitignored, sehingga PHP + vendor harus siap sebelum tsc/vite.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none

            - name: Cache Composer Packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.composer/cache
                      ~/.cache/composer
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install Composer Dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Prepare Environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Generate Wayfinder Routes
              run: php artisan wayfinder:generate

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install NPM Dependencies
              run: npm ci

            - name: Run Vitest
              run: npm run test:unit

            # Typecheck subset unit test (tsconfig.vitest.json) dilanjutkan
            # typecheck proyek penuh (vue-tsc).
            - name: Typecheck Unit Tests
              run: npm run typecheck:unit

            - name: Run Project Typecheck
              run: npm run typecheck

            - name: Build Client Assets
              run: npm run build

            # Produksi menjalankan node SSR, jadi build SSR ikut diverifikasi.
            - name: Build SSR Assets
              run: npm run build:ssr

            - name: Check Bundle Budget
              run: node scripts/build/check-bundle-budget.mjs

    security:
        name: Dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none

            # `--strict` menolak warning, mis. lock hash basi terhadap composer.json.
            - name: Validate Composer Manifest and Lock
              run: composer validate --no-interaction --strict

            # Paket abandoned dilaporkan tanpa memblokir (`--abandoned=report`);
            # advisory keamanan tetap menggagalkan job.
            - name: Audit Locked Composer Dependencies
              run: composer audit --locked --no-interaction --abandoned=report

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            # Gate hanya pada advisory critical untuk dependency produksi.
            # Dependency dev masih membawa high severity (rantai Vite/plugin),
            # jadi gate pada level itu akan memblokir semua PR tanpa aksi nyata.
            - name: Audit Production NPM Dependencies
              run: npm audit --omit=dev --audit-level=critical
